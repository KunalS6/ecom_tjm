services:
  - type: web
    name: tok-jhal-misti
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: TOKJHAL_EMAIL_MODE
        value: resend
      - key: TOKJHAL_OWNER_EMAIL
        value: tokjhalmistico.2027@gmail.com
      - key: TOKJHAL_RESEND_API_KEY
        sync: false
      - key: TOKJHAL_RESEND_FROM
        sync: false
